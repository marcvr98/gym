name: Aviso plazas ENDURANCE

on:
  schedule:
    # Cada 30 min, de 09:00 a 18:00 UTC.
    # Ajustado para cubrir el rango de horario de interés sin ejecutar fuera de ese marco.
    - cron: '*/30 9-18 * * *'
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions

jobs:
  check-plazas:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Ejecutar script de comprobación
        env:
          USUARIO: ${{ secrets.USUARIO }}
          CONTRASENA: ${{ secrets.CONTRASENA }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: python selenium_scraper.py