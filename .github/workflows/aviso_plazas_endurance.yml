name: Aviso plazas ENDURANCE

on:
  schedule:
    - cron: '*/30 9-18 * * *'

  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  check-plazas:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Ejecutar script de comprobación
        id: comprobar
        env:
          USUARIO: ${{ secrets.USUARIO }}
          CONTRASENA: ${{ secrets.CONTRASENA }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          DEBUG_SCRAPER: "1"
          TZ: Europe/Madrid
        run: python selenium_scraper.py

      - name: Desactivar workflow después del correo
        if: steps.comprobar.outputs.mail_sent == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "El correo se ha enviado. Desactivando el workflow..."
          gh workflow disable "$GITHUB_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY"